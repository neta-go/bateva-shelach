<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>בטבע שלך</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f97316;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-image {
      display: block;
      width: 100%;
      max-width: 800px;
      height: auto;
    }

    /* Remove any gap between images */
    img + img {
      display: block;
    }
  </style>
</head>
<body>

  <img class="page-image" src="intro.png" alt="הקדמה" />

  <img class="page-image" src="chapter-3.png" alt="פרק 3" />

  <img class="page-image" src="chapter-4-5.png" alt="פרק 4.5" />
  <img class="page-image" src="chapter-5.png" alt="פרק 5" />
  <img class="page-image" src="chapter-6.png" alt="פרק 6" />
  <img class="page-image" src="chapter-7.png" alt="פרק 7" />
  <img class="page-image" src="chapter-8.png" alt="פרק 8" />

</html>
