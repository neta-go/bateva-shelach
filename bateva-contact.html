<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>צור קשר · בטבע שלך</title>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--terra:#C1521A;--terra-light:#D96A2A;--cream:#F5E8D0;--cream-dark:#EDD9B8;--teal:#4e8090;--white:#fff;--ink:#2C1A0E;--ink-mid:#5C3A20;--ink-soft:#8B6040;--border:#D4C4A0}
body{font-family:'Assistant',sans-serif;font-weight:300;background:var(--cream);color:var(--ink);direction:rtl;line-height:1.8}
nav{position:fixed;top:0;right:0;left:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0.9rem 3rem;background:rgba(245,232,208,0.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.nav-logo{font-family:'Suez One',serif;font-size:1.2rem;color:var(--terra);text-decoration:none;font-weight:400}
.nav-back{color:var(--ink-mid);text-decoration:none;font-size:0.9rem;transition:color 0.2s}
.nav-back:hover{color:var(--terra)}
.page{max-width:600px;margin:0 auto;padding:120px 2rem 5rem;text-align:center}
.page-label{font-size:0.72rem;letter-spacing:0.25em;color:var(--terra);display:inline-block;border-bottom:1px solid var(--terra);padding-bottom:2px;margin-bottom:1.5rem}
h1{font-family:'Suez One',serif;font-size:clamp(2rem,5vw,3rem);color:var(--ink);margin-bottom:1rem;font-weight:400}
.sub{font-size:1.05rem;color:var(--ink-mid);margin-bottom:3rem;line-height:1.8}
.contact-cards{display:flex;flex-direction:column;gap:1rem;margin-bottom:3rem}
.contact-card{background:var(--white);border:1px solid var(--border);border-radius:4px;padding:1.5rem 2rem;display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:inherit;transition:transform 0.2s,box-shadow 0.2s}
.contact-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.08)}
.contact-label{font-size:0.85rem;color:var(--ink-soft);margin-bottom:0.2rem}
.contact-value{font-size:1rem;color:var(--ink);font-weight:400}
.contact-icon{font-size:1.5rem}
.btn-terra{display:inline-block;background:var(--terra);color:#fff;font-family:'Suez One',serif;font-size:1rem;padding:0.85rem 2.5rem;border-radius:2px;text-decoration:none;font-weight:400;transition:background 0.2s}
.btn-terra:hover{background:var(--terra-light)}
footer{background:var(--ink);text-align:center;padding:1.5rem;color:rgba(255,255,255,0.3);font-size:0.8rem}
footer span{color:var(--terra)}
footer a{color:rgba(255,255,255,0.4);text-decoration:none;margin:0 0.5rem}
@media(max-width:768px){nav{padding:0.9rem 1.2rem}.page{padding:100px 1.2rem 4rem}}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="bateva-home.html">בטבע שלך</a>
  <a class="nav-back" href="bateva-home.html">← חזרה לגליון</a>
</nav>
<div class="page">
  <span class="page-label">✦ צור קשר</span>
  <h1>בואי נדבר ♡</h1>
  <p class="sub">שאלות? רוצה להעמיק? כל הודעה נענית באהבה.</p>
  <div class="contact-cards">
    <a href="mailto:neta@neta-golan.com" class="contact-card">
      <div><div class="contact-label">אימייל</div><div class="contact-value">neta@neta-golan.com</div></div>
      <div class="contact-icon">✉</div>
    </a>
    <a href="https://wa.me/9720543454766" class="contact-card">
      <div><div class="contact-label">וואטסאפ</div><div class="contact-value">054-3454-766</div></div>
      <div class="contact-icon">📱</div>
    </a>
    <a href="https://www.neta-golan.com" target="_blank" class="contact-card">
      <div><div class="contact-label">אתר ראשי</div><div class="contact-value">www.neta-golan.com</div></div>
      <div class="contact-icon">🌐</div>
    </a>
  </div>
  <a href="bateva-home.html" class="btn-terra">חזרה לגליון ←</a>
</div>
<footer>
  <p><a href="bateva-home.html">הגליון</a> · <a href="bateva-about.html">אודות</a></p>
  <p>© 2026 <span>בטבע שלך</span> · נטע גולן ♡</p>
</footer>
</body>
</html>
